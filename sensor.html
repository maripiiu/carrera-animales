<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://app.protobject.com/framework/p.js"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; margin: 0; background-color: #2ecc71; color: white;}
        h1 { font-size: 30px; margin-top: 50px; }
        #velocidad { font-size: 80px; font-weight: bold; margin: 20px 0; }
        #btn-empezar { width: 90vw; padding: 20px; font-size: 25px; background-color: #fff; color: #2ecc71; border: none; border-radius: 10px; font-weight: bold;}
    </style>
</head>
<body>
    <button id="btn-empezar">📍 ACTIVAR GPS Y CORRER</button>
    <h1 id="estado">Esperando...</h1>
    <div id="velocidad">0 km/h</div>

    <script>
        document.getElementById('btn-empezar').onclick = function() {
            this.style.display = 'none';
            document.getElementById('estado').innerText = "Buscando señal GPS...";

            // Verificamos si el celular tiene GPS activado
            if ("geolocation" in navigator) {
                // watchPosition sigue tu ubicación en tiempo real
                navigator.geolocation.watchPosition((posicion) => {
                    
                    // El GPS entrega la velocidad en metros por segundo. Puede ser null si estás quieto.
                    let velocidad_ms = posicion.coords.speed; 
                    
                    if (velocidad_ms !== null && velocidad_ms > 0) {
                        // Convertimos a km/h
                        let kmh_real = velocidad_ms * 3.6;
                        
                        document.getElementById('estado').innerText = "¡Corriendo!";
                        document.getElementById('velocidad').innerText = kmh_real.toFixed(1) + " km/h";
                        
                        // Enviamos tu velocidad real por GPS al gráfico del computador
                        Protobject.Core.send({ evento: "paso_dado", velocidad_real: kmh_real });
                    }

                }, (error) => {
                    document.getElementById('estado').innerText = "Error de GPS: " + error.message;
                }, { 
                    enableHighAccuracy: true, // Fuerza a usar el chip GPS real, no solo la red Wi-Fi
                    maximumAge: 0 
                });
            } else {
                document.getElementById('estado').innerText = "Tu navegador no soporta GPS.";
            }
        };
    </script>
</body>
</html>
