<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://app.protobject.com/framework/p.js"></script>
    <script src="config.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; margin: 0; background-color: #2ecc71; color: white;}
        h1 { font-size: 22px; margin-top: 30px; }
        #velocidad { font-size: 60px; font-weight: bold; margin: 10px 0; }
        button { width: 90vw; padding: 20px; font-size: 22px; background-color: #fff; color: #2ecc71; border: none; border-radius: 10px; font-weight: bold; margin-top: 10px;}
        #btn-carrera { display: none; background-color: #e74c3c; color: white; margin-top: 20px; }
        #contador { font-size: 80px; font-weight: bold; color: #f1c40f; display: none; margin-top: 10px;}
    </style>
</head>
<body>
    <button id="btn-empezar">📍 ACTIVAR GPS</button>
    <h1 id="estado">Esperando...</h1>
    <div id="velocidad">0.0 km/h</div>

    <!-- Botón mágico que controla el computador -->
    <button id="btn-carrera">🏁 INICIAR CARRERA (10s)</button>
    <div id="contador">10</div>

    <script>
        let gpsActivo = false;

        document.getElementById('btn-empezar').onclick = function() {
            this.style.display = 'none';
            document.getElementById('estado').innerText = "Buscando señal satelital (Sal afuera)...";

            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition((posicion) => {
                    let velocidad_ms = posicion.coords.speed;
                    let kmh_real = (velocidad_ms !== null && velocidad_ms > 0) ? (velocidad_ms * 3.6) : 0;

                    document.getElementById('velocidad').innerText = kmh_real.toFixed(1) + " km/h";

                    // Cuando agarra señal por primera vez, mostramos el botón de Iniciar
                    if (!gpsActivo) {
                        gpsActivo = true;
                        document.getElementById('estado').innerText = "¡GPS Listo! Prepárate...";
                        document.getElementById('btn-carrera').style.display = "inline-block";
                    }

                    // Enviamos la velocidad constantemente
                    Protobject.Core.send({ evento: "paso_dado", velocidad_real: kmh_real });

                }, (error) => {
                    document.getElementById('estado').innerText = "Error GPS: " + error.message;
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 0
                });
            }
        };

        // Lógica para que el celular inicie la carrera
        document.getElementById('btn-carrera').onclick = function() {
            this.style.display = 'none';
            document.getElementById('estado').innerText = "¡CORRE CON TODO!";
            document.getElementById('contador').style.display = "block";

            // Le avisamos al computador que active los sonidos y su cronómetro
            Protobject.Core.send({ evento: "iniciar_carrera" });

            // Cuenta regresiva visual en tu mano
            let tiempo = 10;
            document.getElementById('contador').innerText = tiempo;

            let intervalo = setInterval(() => {
                tiempo--;
                document.getElementById('contador').innerText = tiempo;
                if (tiempo <= 0) {
                    clearInterval(intervalo);
                    document.getElementById('estado').innerText = "¡TIEMPO TERMINADO!";
                    document.getElementById('contador').innerText = "Mira el PC 👀";
                }
            }, 1000);
        };
    </script>
</body>
</html>
